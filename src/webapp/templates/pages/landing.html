{% extends "base.html" %}

{% block title %}Welcome{% endblock %}

{% block content %}
<section class="hero is-fullheight-with-navbar">
    <div class="hero-body" style="padding: 0;">
        <div class="container is-fluid" style="padding: 0; max-width: 100%;">
            <div class="image-container">
                <figure class="image">
                    <img src="{{ url_for('static', filename='images/tom.jpg') }}" alt="Welcome">
                </figure>
                <div class="overlay">
                    <div class="content has-text-centered">
                        <h1 class="title is-1 has-text-white">
                            Welcome to Catchlist
                        </h1>
                        <p class="subtitle is-4 has-text-white">
                            Organize your thoughts, one task at a time
                        </p>
                        <div class="is-flex is-justify-content-center" style="gap: 12px; flex-wrap: wrap;">
                            <a href="/auth/login" class="button is-primary is-large" data-testid="landing-login-button">
                                <span class="icon">
                                    <i class="fas fa-sign-in-alt"></i>
                                </span>
                                <span>Login</span>
                            </a>
                            <a href="/auth/register" class="button is-light is-outlined is-large" data-testid="landing-register-button">
                                <span class="icon">
                                    <i class="fas fa-user-plus"></i>
                                </span>
                                <span>Register</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
