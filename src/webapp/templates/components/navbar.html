<header class="navbar" role="navigation" aria-label="main navigation"
        x-data="{ isLoggedIn: api.getAuthToken() !== null, navOpen: false }">
    {% set current_path = request.path.rstrip('/') %}
    <div class="navbar-inner">
        <a class="brand" href="/" data-testid="navbar-brand-link">
            <span class="brand-mark"></span>
            Catchlist
        </a>

        <a role="button" class="navbar-burger" aria-label="menu"
           data-testid="navbar-burger"
           :class="{ 'is-active': navOpen }"
           :aria-expanded="navOpen ? 'true' : 'false'"
           @click="navOpen = !navOpen">
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
        </a>

        {# Logged in navigation #}
        <template x-if="isLoggedIn">
            <nav class="nav-links" :class="{ 'is-active': navOpen }">
                <a href="/desk" data-testid="navbar-desk-link" {% if current_path == '/desk' %}class="active"{% endif %} @click="navOpen = false">Desk</a>
                <a href="/tasks" data-testid="navbar-tasks-link" {% if current_path == '/tasks' %}class="active"{% endif %} @click="navOpen = false">Tasks</a>
                <a href="/projects" data-testid="navbar-projects-link" {% if current_path == '/projects' %}class="active"{% endif %} @click="navOpen = false">Projects</a>
                <a href="/routines" data-testid="navbar-routines-link" {% if current_path == '/routines' %}class="active"{% endif %} @click="navOpen = false">Routines</a>
                <a href="/calendars" data-testid="navbar-calendars-link" {% if current_path == '/calendars' %}class="active"{% endif %} @click="navOpen = false">Calendars</a>
                <a href="/tags" data-testid="navbar-tags-link" {% if current_path == '/tags' %}class="active"{% endif %} @click="navOpen = false">Tags</a>
                <a href="/principles" data-testid="navbar-principles-link" {% if current_path == '/principles' %}class="active"{% endif %} @click="navOpen = false">Principles</a>
                <a href="/reports" data-testid="navbar-reports-link" {% if current_path == '/reports' %}class="active"{% endif %} @click="navOpen = false">Reports</a>
            </nav>
        </template>

        <div class="nav-actions">
            <button class="theme-toggle" id="theme-toggle" type="button" role="switch"
                    aria-checked="false" aria-label="Toggle dark mode" title="Toggle dark mode">
                <span class="theme-track"><span class="theme-thumb">&#9789;</span></span>
            </button>

            {# Logged in buttons #}
            <template x-if="isLoggedIn">
                <span class="nav-actions-group">
                    <a class="btn btn-ghost" href="/auth/account" data-testid="navbar-account-button">
                        <i class="fas fa-user" aria-hidden="true"></i> Account
                    </a>
                    <a class="btn btn-danger" href="/auth/logout" data-testid="navbar-logout-button">
                        <i class="fas fa-sign-out-alt" aria-hidden="true"></i> Log out
                    </a>
                </span>
            </template>

            {# Logged out buttons #}
            <template x-if="!isLoggedIn">
                <span class="nav-actions-group">
                    <a class="btn btn-primary" href="/auth/register" data-testid="navbar-register-button">
                        <strong>Sign up</strong>
                    </a>
                    <a class="btn btn-ghost" href="/auth/login" data-testid="navbar-login-button">
                        Log in
                    </a>
                </span>
            </template>
        </div>
    </div>
</header>

<script>
    (function () {
        const btn = document.getElementById("theme-toggle");
        if (!btn) return;
        const thumb = btn.querySelector(".theme-thumb");
        function apply() {
            const dark = document.documentElement.getAttribute("data-theme") === "dark";
            thumb.innerHTML = dark ? "&#9728;" : "&#9789;";
            btn.setAttribute("aria-checked", dark ? "true" : "false");
        }
        btn.addEventListener("click", () => {
            const dark = document.documentElement.getAttribute("data-theme") !== "dark";
            document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
            localStorage.setItem("catchlist-theme", dark ? "dark" : "light");
            apply();
        });
        apply();
    })();
</script>
