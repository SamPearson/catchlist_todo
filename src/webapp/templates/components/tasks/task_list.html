{# Task List Component - Manages and renders a dynamic list of task cards #}

{% macro task_list() %}
{% from "components/shared/tag_principle_picker.html" import tag_principle_picker %}
{% from "components/shared/checkin_list.html" import checkin_list %}
<section class="box" data-testid="task-list">
    <div x-data="taskList(INITIAL_TASKS)" x-init="init()">

        <!-- Error State -->
        <div x-show="error" class="notification is-danger is-light">
            <button class="delete" @click="error = null"></button>
            <span x-text="error"></span>
        </div>

        <!-- Empty State -->
        <div x-show="!error && tasks.length === 0"
             class="empty-state"
             data-testid="task-list-empty">
            <span class="icon has-text-grey">
                <i class="fas fa-check-circle"></i>
            </span>
            <p class="has-text-grey">No tasks found.</p>
        </div>

        <!-- Task Items -->
        <div class="task-list">
        <template x-for="task in tasks" :key="task.id">
            <article class="task-card"
                     x-data="taskCard(task)"
                     :data-testid="`task-card-${task.id}`"
                     :class="task.completed ? 'card-completed' : (!task.active && !task.completed ? 'card-inactive' : '')">

            <!-- Task Row (always visible) -->
                    <div class="task-row"
                         @click="toggleExpand()"
                         style="cursor: pointer;">
                        <span class="task-status-icon" :class="task.completed ? 'has-text-success' : getStatusColor()">
                            <i class="fas" :class="task.completed ? 'fa-check-circle' : 'fa-circle'"></i>
                        </span>

                        <h3 class="task-title"
                            :class="{ 'completed': task.completed }"
                            x-text="task.title"></h3>

                        <div class="task-badges">
                            <span x-show="task.completed" class="tag tag-success">Completed</span>
                            <span x-show="task.project_id && !task.completed" class="tag tag-link">
                                <span class="icon is-small"><i class="fas fa-folder"></i></span>
                                <span>Subtask</span>
                            </span>
                            <span x-show="!task.active && !task.completed" class="tag tag-warning">Someday/Maybe</span>
                        </div>

                        <span class="chevron" :class="{ 'up': expanded }">&#9660;</span>
                    </div>

                    <!-- Task Detail (expanded state) -->
                    <div class="task-detail" x-show="expanded && mode === 'view'">
                        <p class="task-description" x-show="task.description" x-text="task.description"></p>

                        <div class="task-meta">
                            <span class="task-meta-tags">
                                <span class="tag" :class="getStatusTagClass()" x-text="task.status"></span>
                                <span x-show="task.project_id" class="tag tag-link">
                                    <span class="icon is-small"><i class="fas fa-folder"></i></span>
                                    <span>Subtask</span>
                                </span>
                                <span x-show="!task.active" class="tag tag-warning">Someday/Maybe</span>
                                <span x-show="task.completed" class="tag tag-success">
                                    <span class="icon is-small"><i class="fas fa-check"></i></span>
                                    <span>Completed</span>
                                </span>
                            </span>
                            <span><strong>Created:</strong> <span x-text="formatDate(task.created_at)"></span></span>
                            <span><strong>Updated:</strong> <span x-text="formatDate(task.updated_at)"></span></span>
                            <span x-show="task.completed_at"><strong>Completed:</strong> <span x-text="formatDate(task.completed_at)"></span></span>
                        </div>

                        <div class="task-actions">
                            <template x-if="task.active && !task.completed">
                                {# x-if with multiple direct children renders only the first child; wrap siblings in one root div. #}
                                <div>
                                    <button class="btn btn-success btn-sm" @click="completeTask()">
                                        <i class="fas fa-check"></i>
                                        Complete
                                    </button>
                                    <button class="btn btn-link btn-sm" @click="edit()">
                                        <i class="fas fa-edit"></i>
                                        Edit
                                    </button>
                                    <button class="btn btn-danger btn-sm" @click="deleteTask()">
                                        <i class="fas fa-trash"></i>
                                        Delete
                                    </button>
                                </div>
                            </template>

                            <template x-if="task.completed">
                                {# x-if with multiple direct children renders only the first child; wrap siblings in one root div. #}
                                <div>
                                    <button class="btn btn-warning btn-sm" @click="uncompleteTask()">
                                        <i class="fas fa-undo"></i>
                                        Uncomplete
                                    </button>
                                    <button class="btn btn-danger btn-sm" @click="deleteTask()">
                                        <i class="fas fa-trash"></i>
                                        Delete
                                    </button>
                                </div>
                            </template>

                            <template x-if="!task.active && !task.completed">
                                {# x-if with multiple direct children renders only the first child; wrap siblings in one root div. #}
                                <div>
                                    <button class="btn btn-primary btn-sm" @click="activateTask()">
                                        <i class="fas fa-play"></i>
                                        Activate
                                    </button>
                                    <button class="btn btn-link btn-sm" @click="edit()">
                                        <i class="fas fa-edit"></i>
                                        Edit
                                    </button>
                                    <button class="btn btn-danger btn-sm" @click="deleteTask()">
                                        <i class="fas fa-trash"></i>
                                        Delete
                                    </button>
                                </div>
                            </template>
                        </div>

                        {{ checkin_list('task', 'task.id', 'task-card') }}
                    </div>

                    <!-- Edit Mode -->
                    <div class="edit-form" x-show="mode === 'edit'">
                        <div class="field">
                            <label class="label">Task Title <span class="req">*</span></label>
                            <input class="input" type="text" x-model="formData.title"
                                   placeholder="Enter task title"
                                   :class="{ 'is-danger': errors.title }">
                            <p class="help has-text-danger" x-show="errors.title" x-text="errors.title"></p>
                        </div>

                        <div class="field">
                            <label class="label">Description</label>
                            <textarea class="textarea" x-model="formData.description"
                                      placeholder="Add details about this task (optional)"
                                      rows="4"></textarea>
                        </div>

                        <div class="grid-2">
                            <div class="field">
                                <label class="label">Status</label>
                                <select class="select is-fullwidth" x-model="formData.status">
                                    <option value="open">Open</option>
                                    <option value="waiting">Waiting</option>
                                    <option value="deferred">Deferred</option>
                                    <option value="declined">Declined</option>
                                    <option value="stale">Stale</option>
                                </select>
                            </div>
                            <div class="field">
                                <label class="label">Active Status</label>
                                <label class="check-row">
                                    <input type="checkbox" x-model="formData.active">
                                    Active (in working set)
                                </label>
                                <p class="help">Uncheck to move to someday/maybe</p>
                            </div>
                        </div>

                        <div class="field" x-show="task.project_id">
                            <label class="label">Project</label>
                            <div class="placeholder-box">
                                <i class="fas fa-folder has-text-link"></i>
                                This task is a subtask of Project #<span x-text="task.project_id"></span>
                            </div>
                            <p class="help mt-2">Project association cannot be changed from here</p>
                        </div>

                        {{ tag_principle_picker('task', 'task.id', 'task.tags', 'task.principles', 'task-card') }}

                        <div class="meta-box">
                            <p class="section-title">Metadata</p>
                            <span><strong>ID:</strong> <span x-text="task.id"></span></span>
                            <span><strong>Created:</strong> <span x-text="formatDate(task.created_at)"></span></span>
                            <span><strong>Last Updated:</strong> <span x-text="formatDate(task.updated_at)"></span></span>
                            <span x-show="task.completed"><strong>Completed:</strong> <span x-text="formatDate(task.completed_at)"></span></span>
                        </div>

                        <div class="actions">
                            <button class="btn btn-ghost" @click="cancelEdit()">
                                <i class="fas fa-times"></i>
                                Cancel
                            </button>
                            <button class="btn btn-primary"
                                    @click="save()"
                                    :class="{ 'is-loading': saving }"
                                    :disabled="saving">
                                <i class="fas fa-save"></i>
                                Save Changes
                            </button>
                        </div>

                        <div class="danger-zone">
                            <p class="danger-title">Danger Zone</p>
                            <div class="is-flex is-justify-content-space-between is-align-items-center">
                                <div>
                                    <p class="has-text-weight-semibold">Delete this task</p>
                                    <p class="is-size-7 has-text-grey-dark">This action cannot be undone</p>
                                </div>
                                <button class="btn btn-danger" @click="deleteTask()">
                                    <i class="fas fa-trash"></i>
                                    Delete
                                </button>
                            </div>
                        </div>
                    </div>
                </article>
            </template>
        </div>
    </div>
</section>
{% endmacro %}
