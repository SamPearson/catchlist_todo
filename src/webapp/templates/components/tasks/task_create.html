{# Task Create Component #}
{% macro task_create() %}
<section class="box" x-data='taskCreate()' data-testid="task-create-form">
    <div class="box-header" @click="toggleExpand()">
        <h2 class="box-title">
            <span class="icon"><i class="fas fa-plus"></i></span>
            Create New Task
        </h2>
        <span class="chevron" :class="{ 'up': expanded }">&#9660;</span>
    </div>

    <div class="box-body" x-show="expanded">
        <div class="field">
            <label class="label">Task Title <span class="req">*</span></label>
            <input class="input" type="text" x-model="formData.title"
                   placeholder="Enter task title"
                   data-testid="task-create-title-input"
                   :class="{ 'is-danger': errors.title }">
            <p class="help has-text-danger" x-show="errors.title"
               x-text="errors.title" data-testid="task-create-title-error"></p>
        </div>

        <div class="field">
            <label class="label">Description</label>
            <textarea class="textarea" x-model="formData.description"
                      placeholder="Add details about this task (optional)"
                      data-testid="task-create-description-input" rows="4"></textarea>
        </div>

        <div class="grid-2">
            <div class="field">
                <label class="label">Status</label>
                <select class="select is-fullwidth" x-model="formData.status"
                        data-testid="task-create-status-select">
                    <option value="open">Open</option>
                    <option value="waiting">Waiting</option>
                    <option value="deferred">Deferred</option>
                    <option value="declined">Declined</option>
                    <option value="stale">Stale</option>
                </select>
            </div>

            <div class="field">
                <label class="check-row">
                    <input type="checkbox" x-model="formData.active"
                           data-testid="task-create-active-checkbox">
                    Active (in working set)
                </label>
                <p class="help">Uncheck to move to someday/maybe.</p>
            </div>
        </div>

        <div class="placeholder-box" x-show="!createdTask">
            <i class="fas fa-info-circle"></i>
            Tags and principles can be added after the task is created.
        </div>

        <template x-if="createdTask">
        <div>
            {% from "components/shared/tag_principle_picker.html" import tag_principle_picker %}
            {{ tag_principle_picker('task', 'createdTask.id', 'createdTask.tags', 'createdTask.principles', 'task-create') }}
            <hr>
        </div>
        </template>

        <div class="actions">
            <button class="btn btn-ghost" @click="cancel()"
                    data-testid="task-create-cancel-button">
                <i class="fas fa-times"></i>
                Cancel
            </button>
            <button class="btn btn-primary" @click="create()"
                    :class="{ 'is-loading': saving }" :disabled="saving"
                    data-testid="task-create-submit-button">
                <i class="fas fa-plus"></i>
                Create Task
            </button>
        </div>

        <div class="notification is-danger is-light mt-3" role="alert"
             x-show="errors.general" data-testid="task-create-general-error">
            <button class="delete" @click="errors.general = null"></button>
            <span x-text="errors.general"></span>
        </div>
    </div>
</section>
{% endmacro %}
