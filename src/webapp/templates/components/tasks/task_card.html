{# Task Card Component - Handles view/edit mode switching for a single task #}

{% macro task_card(task) %}
<div x-data='taskCard({{ task | tojson }})' class="mb-4" data-testid="task-card-{{ task.id }}">
    <!-- View Mode: Display the task -->
    <template x-if="mode === 'view'">
        <article class="task-card"
                 :class="task.completed ? 'card-completed' : (!task.active && !task.completed ? 'card-inactive' : '')">
            <!-- Task Row (always visible) -->
            <div class="task-row"
                 @click="toggleExpand()"
                 data-testid="task-item-{{ task.id }}-minimized"
                 style="cursor: pointer;">
                <!-- Status Indicator -->
                <span class="task-status-icon" :class="task.completed ? 'has-text-success' : getStatusColor()">
                    <i class="fas" :class="task.completed ? 'fa-check-circle' : 'fa-circle'"></i>
                </span>

                <!-- Title -->
                <h3 class="task-title"
                    :class="{ 'completed': task.completed }"
                    data-testid="task-item-{{ task.id }}-title"
                    x-text="task.title"></h3>

                <!-- Badges -->
                <div class="task-badges">
                    <span x-show="task.completed" class="tag tag-success">Completed</span>
                    <span x-show="task.project_id && !task.completed" class="tag tag-link" data-testid="task-item-{{ task.id }}-subtask-badge">
                        <span class="icon is-small">
                            <i class="fas fa-folder"></i>
                        </span>
                        <span>Subtask</span>
                    </span>
                    <span x-show="!task.active && !task.completed" class="tag tag-warning">
                        Someday/Maybe
                    </span>
                </div>

                <!-- Chevron -->
                <span class="chevron" :class="{ 'up': expanded }">&#9660;</span>
            </div>

            <!-- Task Detail (expanded state) -->
            <div class="task-detail" x-show="expanded" data-testid="task-item-{{ task.id }}-expanded">
                <!-- Description -->
                <p class="task-description" x-show="task.description"
                   data-testid="task-item-{{ task.id }}-description"
                   x-text="task.description"></p>

                <!-- Status and Metadata -->
                <div class="task-meta">
                    <span class="task-meta-tags">
                        <span class="tag" :class="getStatusTagClass()" x-text="task.status"
                              data-testid="task-item-{{ task.id }}-status-badge"></span>
                        <span x-show="task.project_id" class="tag tag-link" data-testid="task-item-{{ task.id }}-subtask-badge-expanded">
                            <span class="icon is-small">
                                <i class="fas fa-folder"></i>
                            </span>
                            <span>Subtask</span>
                        </span>
                        <span x-show="!task.active" class="tag tag-warning">Someday/Maybe</span>
                        <span x-show="task.completed" class="tag tag-success" data-testid="task-item-{{ task.id }}-completed-badge">
                            <span class="icon is-small">
                                <i class="fas fa-check"></i>
                            </span>
                            <span>Completed</span>
                        </span>
                    </span>
                    <span><strong>Created:</strong> <span x-text="formatDate(task.created_at)"></span></span>
                    <span><strong>Updated:</strong> <span x-text="formatDate(task.updated_at)"></span></span>
                    <span x-show="task.completed_at"><strong>Completed:</strong> <span x-text="formatDate(task.completed_at)"></span></span>
                </div>

                <!-- Action Buttons -->
                <div class="task-actions">
                    <!-- Active task buttons -->
                    <template x-if="task.active && !task.completed">
                        {# x-if with multiple direct children renders only the first child; wrap siblings in one root div. #}
                        <div>
                            <button class="btn btn-success btn-sm" data-testid="task-item-{{ task.id }}-complete-button">
                                <i class="fas fa-check"></i>
                                Complete
                            </button>
                            <button class="btn btn-link btn-sm" @click="edit()" data-testid="task-item-{{ task.id }}-edit-button">
                                <i class="fas fa-edit"></i>
                                Edit
                            </button>
                            <button class="btn btn-danger btn-sm" @click="deleteTask()" data-testid="task-item-{{ task.id }}-delete-button">
                                <i class="fas fa-trash"></i>
                                Delete
                            </button>
                        </div>
                    </template>

                    <!-- Completed task buttons -->
                    <template x-if="task.completed">
                        {# x-if with multiple direct children renders only the first child; wrap siblings in one root div. #}
                        <div>
                            <button class="btn btn-warning btn-sm" data-testid="task-item-{{ task.id }}-uncomplete-button">
                                <i class="fas fa-undo"></i>
                                Uncomplete
                            </button>
                            <button class="btn btn-danger btn-sm" @click="deleteTask()" data-testid="task-item-{{ task.id }}-delete-button">
                                <i class="fas fa-trash"></i>
                                Delete
                            </button>
                        </div>
                    </template>

                    <!-- Inactive (someday/maybe) task buttons -->
                    <template x-if="!task.active && !task.completed">
                        {# x-if with multiple direct children renders only the first child; wrap siblings in one root div. #}
                        <div>
                            <button class="btn btn-primary btn-sm" data-testid="task-item-{{ task.id }}-activate-button">
                                <i class="fas fa-play"></i>
                                Activate
                            </button>
                            <button class="btn btn-link btn-sm" @click="edit()" data-testid="task-item-{{ task.id }}-edit-button">
                                <i class="fas fa-edit"></i>
                                Edit
                            </button>
                            <button class="btn btn-danger btn-sm" @click="deleteTask()" data-testid="task-item-{{ task.id }}-delete-button">
                                <i class="fas fa-trash"></i>
                                Delete
                            </button>
                        </div>
                    </template>
                </div>
            </div>
        </article>
    </template>

    <!-- Edit Mode: Show the edit form -->
    <template x-if="mode === 'edit'">
        <div class="box edit-form-wrap" data-testid="task-edit-{{ task.id }}-form">
            <div class="box-header">
                <h2 class="box-title">
                    <span class="icon"><i class="fas fa-edit"></i></span>
                    Edit Task
                </h2>
            </div>

            <div class="box-body">
                <!-- Header with Title Input -->
                <div class="field">
                    <label class="label">Task Title <span class="req">*</span></label>
                    <input class="input"
                           type="text"
                           x-model="formData.title"
                           placeholder="Enter task title"
                           data-testid="task-edit-{{ task.id }}-title-input"
                           :class="{ 'is-danger': errors.title }">
                    <p class="help has-text-danger" x-show="errors.title"
                       x-text="errors.title" data-testid="task-edit-{{ task.id }}-title-error"></p>
                </div>

                <!-- Description -->
                <div class="field">
                    <label class="label">Description</label>
                    <textarea class="textarea"
                              x-model="formData.description"
                              placeholder="Add details about this task (optional)"
                              data-testid="task-edit-{{ task.id }}-description-input"
                              rows="4"></textarea>
                </div>

                <!-- Status and Active Toggle Row -->
                <div class="grid-2">
                    <div class="field">
                        <label class="label">Status</label>
                        <select class="select is-fullwidth" x-model="formData.status"
                                data-testid="task-edit-{{ task.id }}-status-select">
                            <option value="open">Open</option>
                            <option value="waiting">Waiting</option>
                            <option value="deferred">Deferred</option>
                            <option value="declined">Declined</option>
                            <option value="stale">Stale</option>
                        </select>
                    </div>
                    <div class="field">
                        <label class="label">Active Status</label>
                        <label class="check-row">
                            <input type="checkbox" x-model="formData.active"
                                   data-testid="task-edit-{{ task.id }}-active-checkbox">
                            Active (in working set)
                        </label>
                        <p class="help">Uncheck to move to someday/maybe</p>
                    </div>
                </div>

                <!-- Project Association (Read-only) -->
                <div class="field" x-show="task.project_id">
                    <label class="label">Project</label>
                    <div class="placeholder-box">
                        <i class="fas fa-folder has-text-link"></i>
                        This task is a subtask of Project #<span x-text="task.project_id"></span>
                    </div>
                    <p class="help mt-2">Project association cannot be changed from here</p>
                </div>

                <!-- Tags + Principles Picker -->
                {% from "components/shared/tag_principle_picker.html" import tag_principle_picker %}
                {{ tag_principle_picker('task', 'task.id', 'task.tags', 'task.principles', 'task-card') }}

                <!-- Metadata (Read-only) -->
                <div class="meta-box">
                    <p class="section-title">Metadata</p>
                    <span><strong>ID:</strong> <span x-text="task.id"></span></span>
                    <span><strong>Created:</strong> <span x-text="formatDate(task.created_at)"></span></span>
                    <span><strong>Last Updated:</strong> <span x-text="formatDate(task.updated_at)"></span></span>
                    <span x-show="task.completed"><strong>Completed:</strong> <span x-text="formatDate(task.completed_at)"></span></span>
                </div>

                <!-- Action Buttons -->
                <div class="actions">
                    <button class="btn btn-ghost" @click="cancelEdit()"
                            data-testid="task-edit-{{ task.id }}-cancel-button">
                        <i class="fas fa-times"></i>
                        Cancel
                    </button>
                    <button class="btn btn-primary"
                            @click="save()"
                            :class="{ 'is-loading': saving }"
                            :disabled="saving"
                            data-testid="task-edit-{{ task.id }}-save-button">
                        <i class="fas fa-save"></i>
                        Save Changes
                    </button>
                </div>

                <!-- Danger Zone -->
                <div class="danger-zone">
                    <p class="danger-title">Danger Zone</p>
                    <div class="is-flex is-justify-content-space-between is-align-items-center">
                        <div>
                            <p class="has-text-weight-semibold">Delete this task</p>
                            <p class="is-size-7 has-text-grey-dark">This action cannot be undone</p>
                        </div>
                        <button class="btn btn-danger" @click="deleteTask()"
                                data-testid="task-edit-{{ task.id }}-delete-button">
                            <i class="fas fa-trash"></i>
                            Delete
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>
</div>
{% endmacro %}
