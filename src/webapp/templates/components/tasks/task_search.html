{# Task Search Component #}
{% macro task_search() %}
<section class="box" x-data='taskSearch()' class="mb-4" data-testid="task-search-component">

    <div class="search-row">
        <div class="search-input-wrap" x-show="!expanded" data-testid="task-search-simple">
            <span class="icon"><i class="fas fa-search"></i></span>
            <input class="input" type="text" x-model="filters.title"
                   @input="updateFilters()" placeholder="Search tasks..."
                   data-testid="task-search-simple-input">
        </div>
        <button class="btn btn-ghost" @click="expand()" x-show="!expanded"
                data-testid="task-search-expand-button">
            <span class="icon"><i class="fas fa-filter"></i></span>
            Advanced
        </button>
    </div>

    <div class="filter-strip" x-show="hasActiveFilters()"
         data-testid="task-search-active-filters">
        <span class="tag tag-info">
            <span x-text="getActiveFilterCount()"></span> filter(s) active
        </span>
        <button class="tag tag-info tag-delete" @click="clearFilters()"
                data-testid="task-search-clear-filters-tag">Clear</button>
    </div>

    <div class="search-advanced" x-show="expanded" data-testid="task-search-advanced">
        <div class="is-flex is-justify-content-space-between is-align-items-center mb-4">
            <h2 class="box-title">Search &amp; Filter Tasks</h2>
            <button class="delete" @click="collapse()"
                    aria-label="Close search" data-testid="task-search-collapse-button"></button>
        </div>

        <div class="grid-2">
            <div class="field">
                <label class="label">Title</label>
                <input class="input" type="text" x-model="filters.title"
                       @input="updateFilters()" placeholder="Search in task titles..."
                       data-testid="task-search-title-input">
            </div>
            <div class="field">
                <label class="label">Description</label>
                <input class="input" type="text" x-model="filters.description"
                       @input="updateFilters()" placeholder="Search in task descriptions..."
                       data-testid="task-search-description-input">
            </div>
        </div>

        <div class="field">
            <label class="label">Status</label>
            <div class="check-group">
                <label class="radio-label"><input type="checkbox" x-model="filters.status.open" value="open" @change="updateFilters()" data-testid="task-search-status-open-checkbox"> Open</label>
                <label class="radio-label"><input type="checkbox" x-model="filters.status.waiting" value="waiting" @change="updateFilters()" data-testid="task-search-status-waiting-checkbox"> Waiting</label>
                <label class="radio-label"><input type="checkbox" x-model="filters.status.deferred" value="deferred" @change="updateFilters()" data-testid="task-search-status-deferred-checkbox"> Deferred</label>
                <label class="radio-label"><input type="checkbox" x-model="filters.status.declined" value="declined" @change="updateFilters()" data-testid="task-search-status-declined-checkbox"> Declined</label>
                <label class="radio-label"><input type="checkbox" x-model="filters.status.stale" value="stale" @change="updateFilters()" data-testid="task-search-status-stale-checkbox"> Stale</label>
            </div>
        </div>

        <div class="grid-2">
            <div class="field">
                <label class="label">Active Status</label>
                <div class="check-group">
                    <label class="radio-label"><input type="radio" name="active-status" x-model="filters.activeStatus" value="active" @change="updateFilters()" data-testid="task-search-active-status-active-radio"> Active only</label>
                    <label class="radio-label"><input type="radio" name="active-status" x-model="filters.activeStatus" value="all" @change="updateFilters()" data-testid="task-search-active-status-all-radio"> All</label>
                    <label class="radio-label"><input type="radio" name="active-status" x-model="filters.activeStatus" value="inactive" @change="updateFilters()" data-testid="task-search-active-status-inactive-radio"> Someday/Maybe only</label>
                </div>
                <p class="help">Filter by whether tasks are in your active working set</p>
            </div>

            <div class="field">
                <label class="label">Completion Status</label>
                <div class="check-group">
                    <label class="radio-label"><input type="radio" name="completion-status" x-model="filters.completionStatus" value="incomplete" @change="updateFilters()" data-testid="task-search-completion-status-incomplete-radio"> Incomplete only</label>
                    <label class="radio-label"><input type="radio" name="completion-status" x-model="filters.completionStatus" value="all" @change="updateFilters()" data-testid="task-search-completion-status-all-radio"> All</label>
                    <label class="radio-label"><input type="radio" name="completion-status" x-model="filters.completionStatus" value="complete" @change="updateFilters()" data-testid="task-search-completion-status-complete-radio"> Completed only</label>
                </div>
            </div>
        </div>

        <div class="placeholder-box">
            <i class="fas fa-folder"></i>
            Project filtering coming soon.
        </div>
        <div class="placeholder-box">
            <i class="fas fa-tags"></i>
            Tag filtering coming soon.
        </div>
        <div class="placeholder-box">
            <i class="fas fa-compass"></i>
            Principle filtering coming soon.
        </div>

        <div class="actions">
            <button class="btn btn-ghost" @click="clearFilters()"
                    data-testid="task-search-clear-filters-button">
                <i class="fas fa-times"></i>
                Clear Filters
            </button>
        </div>
    </div>
</section>
{% endmacro %}
