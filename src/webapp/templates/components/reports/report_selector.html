{% macro report_selector() %}
<div x-data="reportSelector()" class="box">
    <div class="box-pad">

        {# --- Type Tab Bar --- #}
        <div class="tabs">
            <template x-for="type in reportTypes" :key="type">
                <button type="button" class="tab" :class="{ 'active': reportType === type }"
                        @click="reportType = type"
                        x-text="type.charAt(0).toUpperCase() + type.slice(1)"></button>
            </template>
        </div>

        {# --- Contextual Date Picker --- #}

        {# Day #}
        <template x-if="reportType === 'day'">
            <div class="field">
                <label class="label">Date</label>
                <div class="picker-row">
                    <input class="input" type="date" x-model="day.date">
                </div>
            </div>
        </template>

        {# Week #}
        <template x-if="reportType === 'week'">
            <div class="field">
                <label class="label">Any date within the week</label>
                <div class="picker-row">
                    <input class="input" type="date" x-model="week.date">
                </div>
            </div>
        </template>

        {# Month #}
        <template x-if="reportType === 'month'">
            <div class="field">
                <label class="label">Month</label>
                <div class="picker-row">
                    <select class="select" style="width: 12rem;" x-model.number="month.month">
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                    <div class="field">
                        <input class="input input-year" type="number" x-model.number="month.year" min="2000" max="2100">
                    </div>
                </div>
            </div>
        </template>

        {# Season #}
        <template x-if="reportType === 'season'">
            <div class="field">
                <label class="label">Season</label>
                <div class="picker-row">
                    <select class="select" style="width: 12rem;" x-model="season.season">
                        <option value="winter">Winter</option>
                        <option value="spring">Spring</option>
                        <option value="summer">Summer</option>
                        <option value="fall">Fall</option>
                    </select>
                    <div class="field">
                        <input class="input input-year" type="number" x-model.number="season.year" min="2000" max="2100">
                    </div>
                </div>
            </div>
        </template>

        {# Year #}
        <template x-if="reportType === 'year'">
            <div class="field">
                <label class="label">Year</label>
                <div class="picker-row">
                    <div class="field">
                        <input class="input input-year" type="number" x-model.number="year.year" min="2000" max="2100">
                    </div>
                </div>
            </div>
        </template>

        {# --- Selection Summary + Navigation + Load --- #}
        <div class="report-nav">
            <button class="nav-arrow" @click="prev()" title="Previous">&#9664;</button>
            <span class="nav-label" x-text="selectionLabel"></span>
            <button class="nav-arrow" @click="next()" title="Next">&#9654;</button>
            <button class="btn btn-primary" @click="loadReport()">Load Report</button>
        </div>

    </div>
</div>
{% endmacro %}
