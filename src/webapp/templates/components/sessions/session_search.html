{# Session Search Component - Filter and search sessions #}

{% macro session_search() %}
<section class="box" data-testid="session-search-component">
    <div class="box-header" @click="expanded ? collapse() : expand()" data-testid="session-search-expand-button">
        <h2 class="box-title">
            <span class="icon"><i class="fas fa-search"></i></span>
            Search Sessions
        </h2>
        <span class="chevron" :class="{ 'up': expanded }">&#9660;</span>
    </div>

    <div class="box-body" x-show="expanded">
        <!-- Date Range -->
        <div class="grid-2">
            <div class="field">
                <label class="label">Start Date</label>
                <input type="datetime-local" x-model="dateRange.start" class="input" data-testid="session-search-start-input">
            </div>
            <div class="field">
                <label class="label">End Date</label>
                <input type="datetime-local" x-model="dateRange.end" class="input" data-testid="session-search-end-input">
            </div>
        </div>

        <!-- Status Filter -->
        <div class="field">
            <label class="label">Status</label>
            <div class="check-group">
                <label class="radio-label">
                    <input type="checkbox" x-model="filters.status.scheduled" data-testid="session-search-status-scheduled-checkbox">
                    Scheduled
                </label>
                <label class="radio-label">
                    <input type="checkbox" x-model="filters.status.completed" data-testid="session-search-status-completed-checkbox">
                    Completed
                </label>
                <label class="radio-label">
                    <input type="checkbox" x-model="filters.status.skipped" data-testid="session-search-status-skipped-checkbox">
                    Skipped
                </label>
                <label class="radio-label">
                    <input type="checkbox" x-model="filters.status.cancelled" data-testid="session-search-status-cancelled-checkbox">
                    Cancelled
                </label>
            </div>
        </div>

        <!-- Tags Filter -->
        <div class="field">
            <label class="label">Tags</label>
            <div class="chip-row">
                <template x-for="(tag, index) in filters.tags" :key="index">
                    <span class="chip">
                        <span x-text="tag"></span>
                        <button class="tag-delete" @click="removeTag(index)" title="Remove tag" aria-label="Remove tag">&times;</button>
                    </span>
                </template>
                <button class="chip add-chip" @click="showTagForm = !showTagForm; if (showTagForm) $nextTick(() => $refs.tagInput.focus())">
                    + Add
                </button>
                <div class="chip-add-form" x-show="showTagForm">
                    <input x-ref="tagInput" type="text" x-model="filters.tagInput" class="input"
                           placeholder="Add a tag and press Enter"
                           @keydown.enter.prevent="addTag()"
                           data-testid="session-search-tag-input">
                    <button class="btn btn-ghost btn-sm" @click="showTagForm = false">Done</button>
                </div>
            </div>
        </div>

        <!-- Principles Filter -->
        <div class="field">
            <label class="label">Principles</label>
            <div class="chip-row">
                <template x-for="(principle, index) in filters.principles" :key="index">
                    <span class="chip">
                        <span x-text="principle"></span>
                        <button class="tag-delete" @click="removePrinciple(index)" title="Remove principle" aria-label="Remove principle">&times;</button>
                    </span>
                </template>
                <button class="chip add-chip" @click="showPrincipleForm = !showPrincipleForm; if (showPrincipleForm) $nextTick(() => $refs.principleInput.focus())">
                    + Add
                </button>
                <div class="chip-add-form" x-show="showPrincipleForm">
                    <input x-ref="principleInput" type="text" x-model="filters.principleInput" class="input"
                           placeholder="Add a principle and press Enter"
                           @keydown.enter.prevent="addPrinciple()"
                           data-testid="session-search-principle-input">
                    <button class="btn btn-ghost btn-sm" @click="showPrincipleForm = false">Done</button>
                </div>
            </div>
        </div>

        <!-- Active Filters -->
        <div class="filter-strip" x-show="hasActiveFilters()" data-testid="session-search-active-filters">
            <span class="tag tag-info">
                <span x-text="getActiveFilterCount()"></span>&nbsp;filter(s) active
            </span>
        </div>

        <!-- Actions -->
        <div class="actions">
            <button class="btn btn-ghost" @click="clearFilters()" data-testid="session-search-clear-filters-button">
                <i class="fas fa-times"></i> Clear Filters
            </button>
            <button class="btn btn-primary" @click="search()" :class="{ 'is-loading': loading }" :disabled="loading"
                    data-testid="session-search-submit-button">
                <i class="fas fa-search"></i>
                <span x-show="!loading">Search</span>
                <span x-show="loading">Searching...</span>
            </button>
        </div>
    </div>
</section>
{% endmacro %}
