{# Session List Component - Renders a list of sessions dynamically #}
{% from "components/sessions/session_display.html" import session_display_card %}

{% macro session_list() %}
<div class="box p-0" x-data="sessionList(INITIAL_SESSIONS)" @init="init()">
    <template x-for="session in sessions" :key="session.id">
        <div x-data='sessionDisplay(session)' class="mb-6" :data-testid="`session-item-${session.id}`">
            {{ session_display_card() }}
        </div>
    </template>

    <div x-show="sessions.length === 0" class="p-5 has-text-centered has-text-grey">
        <p>No sessions found.</p>
    </div>
</div>
{% endmacro %}
