{# Session List Component - Renders a list of sessions dynamically #}
{% from "components/sessions/session_display.html" import session_display_card %}

{% macro session_list() %}
<section class="box" data-testid="session-list">
    <!-- Empty State -->
    <div x-show="sessions.length === 0" class="empty-state" data-testid="session-list-empty">
        <span class="icon has-text-grey">
            <i class="fas fa-calendar-check"></i>
        </span>
        <p class="has-text-grey">No sessions found.</p>
    </div>

    <!-- Session Items -->
    <div class="session-list">
        <template x-for="session in sessions" :key="session.id">
            <article class="session-card" x-data='sessionDisplay(session)' :data-testid="`session-card-${session.id}`">
                {{ session_display_card() }}
            </article>
        </template>
    </div>
</section>
{% endmacro %}
